[pytest]
# Invoked from the repo root as `pytest tests/evals` (see
# .github/workflows/evals.yml) — pytest auto-discovers this file because
# it's the nearest ini file to the collected tests. Intentionally NOT a
# root-level pytest.ini/pyproject.toml: backend-engineer may add a
# project-wide one later, at which point markers registered here (also
# duplicated in conftest.py's pytest_configure, which always runs
# regardless of which ini is picked up) keep working either way.
python_files = test_*.py
